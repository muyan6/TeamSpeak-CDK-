services:
  teamspeak-manager:
    build: .
    container_name: ts-manager-service
    restart: unless-stopped
    ports:
      - "12345:12345"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=12345
      # 必填：不再内置 admin123456 这类弱默认口令，未设置时容器会生成随机口令并打印到日志
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?请在 .env 中设置 ADMIN_PASSWORD}
      - TS_DATA_DIR=/data/teamspeak
      - DB_PATH=/app/db/teamspeak_manager.db
      # 显式指定对外连接地址，避免依赖 Host 头
      - PUBLIC_SERVER_IP=${PUBLIC_SERVER_IP:-}
      # 仅在可信反代之后才设为 1
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-0}
      # 音乐机器人平台凭据（选填，也可稍后在管理后台配置）
      - BOT_PANEL_URL=${BOT_PANEL_URL:-}
      - BOT_PANEL_USER=${BOT_PANEL_USER:-}
      - BOT_PANEL_PASS=${BOT_PANEL_PASS:-}
      - BOT_TUTORIAL_URL=${BOT_TUTORIAL_URL:-}
    volumes:
      # 挂载宿主机 Docker 套接字，允许容器内调度宿主机的 Docker
      - /var/run/docker.sock:/var/run/docker.sock
      # 挂载宿主机 TS 数据目录与生成的 compose 文件
      - /data/teamspeak:/data/teamspeak
      # 使用命名卷保存数据库，避免宿主机文件不存在时被 Docker 创建成目录
      - ts_manager_db:/app/db

volumes:
  ts_manager_db:
