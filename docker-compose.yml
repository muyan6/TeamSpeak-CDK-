version: '3.8'

services:
  teamspeak-manager:
    build: .
    container_name: ts-manager-service
    restart: always
    ports:
      - "12345:12345"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=12345
      - ADMIN_PASSWORD=admin123456
      - TS_DATA_DIR=/data/teamspeak
      - PUBLIC_SERVER_IP=
    volumes:
      # 挂载宿主机 Docker 套接字，允许容器内调度宿主机的 Docker
      - /var/run/docker.sock:/var/run/docker.sock
      # 挂载宿主机 TS 数据目录与生成的 compose 文件
      - /data/teamspeak:/data/teamspeak
      # 挂载数据库
      - ./teamspeak_manager.db:/app/teamspeak_manager.db
